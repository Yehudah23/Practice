<div style="height: 500px; width: 500px; background-color: lightgray;">

<div style="display: block; flex-direction: column; align-items: center; justify-content: center; height: 100px; width: 100px;">
  <input type="text" placeholder="Enter you value " [(ngModel)]="value"  style="border-radius: 5px;"/>
  <button (click)="increase()">Increment</button>
  <button (click)="decrease(value)">Decrement</button>
</div>
</div>
